name: Install one direct scrolling ticker
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, 'Direct ticker applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace ribbon with direct scrolling text
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new = '<div class="ribbon"><div class="ribbon-scroll">✨ మా దగ్గర COMPUTER EMBROIDERY WORKS STARTING PRICE ₹500/- మాత్రమే ✨&nbsp;&nbsp;&nbsp;&nbsp;💖 Friends • బయట boutiques లో కట్టించే rate కంటే మా దగ్గర BEST PRICE OFFER మీకోసం 💖</div></div>'
          s2, n = re.subn(r'<div class="ribbon">.*?</div>', new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Ribbon HTML not found')
          p.write_text(s2, encoding='utf-8')
      - name: Replace ticker CSS
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/style.css')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* AADHYA DIRECT TICKER */\n.ribbon{position:relative!important;height:58px!important;min-height:58px!important;padding:0!important;background:linear-gradient(90deg,#0b1026,#182b59,#153b4a,#1b2440,#0b1026)!important;overflow:hidden!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;text-align:left!important;font-size:0!important;color:transparent!important;line-height:0!important}\n.ribbon:before,.ribbon:after{content:none!important;display:none!important}\n.ribbon-scroll{display:block!important;flex:0 0 auto!important;width:max-content!important;white-space:nowrap!important;font-family:system-ui,sans-serif!important;font-size:24px!important;line-height:1!important;font-weight:1000!important;letter-spacing:.2px!important;color:#fff!important;animation:aadhyaDirectTicker 34s linear infinite!important;will-change:transform!important}\n@keyframes aadhyaDirectTicker{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}\n@media(max-width:560px){.ribbon{height:48px!important;min-height:48px!important}.ribbon-scroll{font-size:17px!important}}\n'''
          marker = '/* AADHYA DIRECT TICKER */'
          if marker in s:
              s = s[:s.index(marker)]
          p.write_text(s.rstrip() + '\n' + css, encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/style.css
          git diff --cached --quiet && exit 0
          git commit -m 'Direct ticker applied'
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/final-direct-ticker.yml
          git add .github/workflows/final-direct-ticker.yml
          git commit -m 'Remove direct ticker workflow [skip ci]' || true
          git push || true