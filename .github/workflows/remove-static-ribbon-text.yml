name: Remove static ribbon text

on:
  push:
    paths:
      - '.github/workflows/remove-static-ribbon-text.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove static ribbon text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/style.css')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.ribbon{position:relative;background:linear-gradient(90deg,#14061f,#32104d,#08253f,#063b39,#1d071e);color:#fff;text-align:center;font-family:system-ui,sans-serif;font-weight:800;padding:8px 6px 43px;font-size:11px;', '.ribbon{position:relative;background:linear-gradient(90deg,#14061f,#32104d,#08253f,#063b39,#1d071e);color:#fff;text-align:center;font-family:system-ui,sans-serif;font-weight:800;padding:8px 6px 43px;font-size:0;')
          s=s.replace('.ribbon{font-size:9px;padding:8px 0 42px}', '.ribbon{font-size:0;padding:8px 0 42px}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit CSS change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/style.css
          git diff --cached --quiet || git commit -m 'Hide static ribbon text'
          git push