name: Aadhya ticker fix

on:
  push:
    paths:
      - .github/workflows/aadhya-ticker-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update ticker CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/style.css')
          s = p.read_text(encoding='utf-8')
          start = s.index('.ribbon{')
          end = s.index('.hero{', start)

          ticker = '''.ribbon{position:relative;background:linear-gradient(90deg,#12081d,#3c0d38,#071a35,#0b3c3c,#1f0b2e);color:#fff;text-align:center;font-family:system-ui,sans-serif;font-weight:800;padding:8px 6px 43px;font-size:11px;letter-spacing:.4px;overflow:hidden}.ribbon:after{content:"✨ మా దగ్గర COMPUTER EMBROIDERY WORKS STARTING PRICE ₹500/- మాత్రమే ✨\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0💖 Friends • బయట boutiques లో కట్టించే rate కంటే మా దగ్గర BEST PRICE OFFER మీకోసం 💖";position:absolute;left:0;top:31px;display:block;width:max-content;font-family:system-ui,sans-serif;font-size:24px;line-height:1;font-weight:1000;letter-spacing:.2px;background:linear-gradient(90deg,#ffffff 0%,#ffe44f 18%,#ff67bd 35%,#ffffff 51%,#58f6ff 67%,#ffe44f 83%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 9px rgba(255,255,255,.98),0 0 19px rgba(255,212,65,.7);white-space:pre;animation:aadhyaPriceScroll 28s linear infinite;will-change:transform}@keyframes aadhyaPriceScroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}'''

          s = s[:start] + ticker + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/style.css .github/workflows/aadhya-ticker-fix.yml
          git rm .github/workflows/aadhya-ticker-fix.yml
          git commit -m "Fix ticker spacing, contrast and scrolling"
          git push
