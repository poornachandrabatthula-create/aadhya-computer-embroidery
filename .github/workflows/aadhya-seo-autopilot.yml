name: Aadhya SEO Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SEO assets, sitemap and gallery manifest
        run: python automation/aadhya_seo.py

      - name: Create Pull Request for automated maintenance
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/aadhya-seo-maintenance
          delete-branch: true
          title: "chore: refresh Aadhya SEO assets"
          commit-message: "chore: refresh Aadhya SEO assets"
          add-paths: |
            sitemap.xml
            robots.txt
            gallery-data.json
            automation-status.json
          body: |
            Automated maintenance for Aadhya website SEO assets.
            This workflow creates a PR instead of pushing directly to protected main.
