name: Final gallery CTA highlight
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  style:
    if: "!startsWith(github.event.head_commit.message, 'Apply final gallery CTA')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CTA styles
        shell: bash
        run: |
          cat >> assets/style.css <<'EOF'
          /* AADHYA FINAL GALLERY CTA */
          .gallery + .actions .btn.alt{
            min-width:310px!important;
            min-height:62px!important;
            padding:16px 36px!important;
            border:3px solid #d29b2e!important;
            border-radius:14px!important;
            background:linear-gradient(135deg,#65103f 0%,#a51d62 50%,#6e3a8d 100%)!important;
            color:#fff!important;
            font-family:system-ui,sans-serif!important;
            font-size:19px!important;
            line-height:1.15!important;
            font-weight:1000!important;
            letter-spacing:.25px!important;
            box-shadow:0 12px 30px rgba(101,16,63,.30),0 0 0 4px rgba(210,155,46,.14)!important;
            text-shadow:0 1px 2px rgba(0,0,0,.25)!important;
            transform:none!important;
            transition:transform .2s ease,box-shadow .2s ease!important;
          }
          .gallery + .actions .btn.alt::after{content:'  →';font-size:22px;font-weight:1000}
          .gallery + .actions .btn.alt:hover,.gallery + .actions .btn.alt:focus-visible{
            transform:translateY(-4px) scale(1.03)!important;
            box-shadow:0 18px 42px rgba(101,16,63,.38),0 0 0 5px rgba(210,155,46,.22)!important;
          }
          @media(max-width:560px){
            .gallery + .actions .btn.alt{min-width:0!important;width:min(92vw,340px)!important;min-height:58px!important;padding:15px 24px!important;font-size:17px!important;border-radius:13px!important}
            .gallery + .actions .btn.alt::after{font-size:20px}
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/style.css
          git diff --cached --quiet && exit 0
          git commit -m 'Apply final gallery CTA'
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/final-gallery-cta.yml
          git add .github/workflows/final-gallery-cta.yml
          git commit -m 'Remove gallery CTA workflow [skip ci]' || exit 0
          git push
