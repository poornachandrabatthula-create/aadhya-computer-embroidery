name: Aadhya ticker clean style
on:
  push:
    paths:
      - .github/workflows/ticker-clean-style.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove shine and change ticker background
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/style.css')
          s = p.read_text(encoding='utf-8')
          old = '.ribbon{position:relative;background:linear-gradient(90deg,#14061f,#32104d,#08253f,#063b39,#1d071e);color:#fff;text-align:center;font-family:system-ui,sans-serif;font-weight:800;padding:8px 6px 43px;font-size:11px;letter-spacing:.4px;overflow:hidden}'
          new = '.ribbon{position:relative;background:linear-gradient(90deg,#0b1026,#182b59,#153b4a,#1b2440,#0b1026);color:#fff;text-align:center;font-family:system-ui,sans-serif;font-weight:800;padding:8px 6px 43px;font-size:11px;letter-spacing:.4px;overflow:hidden}'
          if old not in s:
              raise SystemExit("ribbon background block not found")
          s = s.replace(old,new,1)
          old2 = 'color:#fff;white-space:pre;text-shadow:0 0 4px #fff,0 0 10px #00d9ff,0 0 18px #ff2d92;animation:aadhyaPriceScroll 26s linear infinite;will-change:transform}'
          new2 = 'color:#fff;white-space:pre;text-shadow:none;animation:aadhyaPriceScroll 26s linear infinite;will-change:transform}'
          if old2 not in s:
              raise SystemExit("ticker text glow block not found")
          s = s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/style.css
          git rm .github/workflows/ticker-clean-style.yml
          git commit -m "Remove ticker shine and refresh background"
          git push
