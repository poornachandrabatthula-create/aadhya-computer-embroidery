name: Hide static ribbon text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-static-ribbon-text.yml'

permissions:
  contents: write

jobs:
  fix-ribbon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add hard ribbon override
        run: |
          cat >> assets/style.css <<'EOF'
          /* AADHYA: show only the scrolling offer line */
          .ribbon{font-size:0!important;color:transparent!important;line-height:0!important}
          .ribbon:after{font-size:24px!important;line-height:1!important;color:#fff!important;text-shadow:none!important}
          @media(max-width:560px){.ribbon{font-size:0!important;line-height:0!important}.ribbon:after{font-size:17px!important;line-height:1.05!important}}
          EOF
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/style.css
          git commit -m "Hide static ribbon text" || exit 0
          git push
