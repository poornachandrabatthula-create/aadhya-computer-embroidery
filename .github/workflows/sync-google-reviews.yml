name: Sync Google Review Count

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Google Places API secret
        id: secret
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLACES_API_KEY is not configured; skipping review sync without failing the workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Google rating and review count
        if: steps.secret.outputs.configured == 'true'
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python3 .github/scripts/sync_google_reviews.py

      - name: Create Pull Request for review update
        if: steps.secret.outputs.configured == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/google-review-sync
          delete-branch: true
          title: "chore: sync Google review count and rating"
          commit-message: "chore: sync Google review count and rating"
          add-paths: index.html
          body: |
            Automated Google review/rating refresh for Aadhya.
            The PR is created instead of pushing directly to protected main.
