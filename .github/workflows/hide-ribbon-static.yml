name: Hide static ribbon text
on:
  push:
    branches: [main]
jobs:
  fix-ribbon:
    if: "!startsWith(github.event.head_commit.message, 'Hide static ribbon text - apply')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Hide static ribbon text
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('assets/style.css')
          s = p.read_text(encoding='utf-8')
          ns, n = re.subn(r'(\.ribbon\{[^}]*?font-size:)11px', r'\g<1>0', s, count=1)
          if n:
              p.write_text(ns, encoding='utf-8')
          else:
              print('Ribbon font-size already changed or pattern not found')
      - name: Commit CSS fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/style.css
          git diff --cached --quiet && exit 0
          git commit -m 'Hide static ribbon text - apply'
          git push