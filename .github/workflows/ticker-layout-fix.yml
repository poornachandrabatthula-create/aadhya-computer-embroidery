name: Fix scrolling offer bar layout
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ticker layout
        shell: bash
        run: |
          cat >> assets/style.css <<'EOF'
          /* ticker layout fix */
          .ribbon{height:64px!important;min-height:64px!important;padding:0 6px!important;display:block!important;overflow:hidden!important}
          .ribbon:after{top:17px!important;line-height:1.15!important;height:auto!important;max-height:32px!important;white-space:pre!important;overflow:visible!important}
          @media(max-width:560px){
            .ribbon{height:54px!important;min-height:54px!important;padding:0!important}
            .ribbon:after{top:14px!important;font-size:17px!important;line-height:1.15!important;max-height:24px!important}
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/style.css
          git commit -m 'Fix scrolling offer bar layout [skip ci]' || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/ticker-layout-fix.yml
          git add .github/workflows/ticker-layout-fix.yml
          git commit -m 'Remove temporary ticker fix workflow [skip ci]' || exit 0
          git push