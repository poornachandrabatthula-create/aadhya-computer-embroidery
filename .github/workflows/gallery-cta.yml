name: Highlight gallery button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  style:
    if: "!startsWith(github.event.head_commit.message, 'Gallery CTA - apply')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add gallery CTA styling
        shell: bash
        run: |
          cat >> assets/style.css <<'EOF'
          /* AADHYA GALLERY CTA */
          .gallery + .actions .btn.alt{
            min-width:300px!important;
            padding:16px 30px!important;
            border-radius:999px!important;
            background:linear-gradient(135deg,#65103f 0%,#a51d62 55%,#6e3a8d 100%)!important;
            color:#fff!important;
            border:3px solid #e5b94f!important;
            font-family:system-ui,sans-serif!important;
            font-size:21px!important;
            line-height:1.15!important;
            font-weight:1000!important;
            letter-spacing:.2px!important;
            box-shadow:0 10px 28px rgba(101,16,63,.30),0 0 0 5px rgba(229,185,79,.12)!important;
            transform:translateY(0)!important;
            transition:transform .2s ease,box-shadow .2s ease!important;
          }
          .gallery + .actions .btn.alt::after{content:'  →';font-weight:1000!important;font-size:1.08em!important}
          .gallery + .actions .btn.alt:hover,.gallery + .actions .btn.alt:focus-visible{
            transform:translateY(-3px) scale(1.03)!important;
            box-shadow:0 15px 34px rgba(101,16,63,.38),0 0 0 7px rgba(229,185,79,.18)!important;
          }
          @media(max-width:560px){
            .gallery + .actions .btn.alt{min-width:260px!important;padding:14px 22px!important;font-size:18px!important}
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/style.css
          git diff --cached --quiet && exit 0
          git commit -m 'Gallery CTA - apply'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/gallery-cta.yml
          git add .github/workflows/gallery-cta.yml
          git commit -m 'Remove gallery CTA workflow [skip ci]' || exit 0
          git push
