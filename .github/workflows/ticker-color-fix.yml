name: Aadhya ticker colour fix
on:
  push:
    paths:
      - .github/workflows/ticker-color-fix.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ticker colours
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('assets/style.css')
          s = p.read_text(encoding='utf-8')
          start = s.index('.ribbon{')
          end = s.index('.hero{', start)
          ticker = '''.ribbon{position:relative;background:linear-gradient(90deg,#080713,#1b0a2e,#06233a,#071c1c,#18071d);color:#fff;text-align:center;font-family:system-ui,sans-serif;font-weight:800;padding:8px 6px 43px;font-size:11px;letter-spacing:.4px;overflow:hidden}.ribbon:after{content:"✨ మా దగ్గర COMPUTER EMBROIDERY WORKS STARTING PRICE ₹500/- మాత్రమే ✨\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0\\00a0💖 Friends • బయట boutiques లో కట్టించే rate కంటే మా దగ్గర BEST PRICE OFFER మీకోసం 💖";position:absolute;left:0;top:31px;display:block;width:max-content;font-family:system-ui,sans-serif;font-size:24px;line-height:1;font-weight:1000;letter-spacing:.2px;background:linear-gradient(90deg,#ff3b30 0%,#ffd60a 16%,#34c759 32%,#00d4ff 48%,#5e5ce6 64%,#ff2d92 80%,#ff3b30 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.35px rgba(255,255,255,.65);text-shadow:0 0 5px rgba(255,255,255,.95),0 0 13px rgba(0,212,255,.7),0 0 20px rgba(255,45,146,.45);white-space:pre;animation:aadhyaPriceScroll 28s linear infinite,aadhyaTickerColors 3.6s linear infinite;will-change:transform,background-position}@keyframes aadhyaPriceScroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}@keyframes aadhyaTickerColors{from{background-position:0% 50%}to{background-position:300% 50%}}'''
          s = s[:start] + ticker + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit CSS and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/style.css
          git rm .github/workflows/ticker-color-fix.yml
          git commit -m "Make ticker colours visibly change"
          git push