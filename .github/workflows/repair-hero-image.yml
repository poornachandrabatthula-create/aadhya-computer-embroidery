name: Temporary hero image repair
on:
  push:
    branches: [fix-hero-image]
permissions:
  contents: write
jobs:
  repair:
    if: "!startsWith(github.event.head_commit.message, 'Repair hero image')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild hero WebP from original PNG
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from PIL import Image
          src='assets/ChatGPT Image Sep 15, 2026, 03_48_43 PM.png'
          out='assets/hero-aadhya.webp'
          im=Image.open(src).convert('RGB')
          im.thumbnail((1000,1000), Image.Resampling.LANCZOS)
          im.save(out,'WEBP',quality=82,method=6)
          print('saved', im.size)
          PY
      - name: Commit repaired image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-aadhya.webp
          git diff --cached --quiet && exit 0
          git commit -m "Repair hero image"
          git push
