name: Aadhya ticker solid text
on:
  push:
    paths:
      - .github/workflows/ticker-solid-fix.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make ticker text solid and bright
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/style.css')
          s = p.read_text(encoding='utf-8')
          start = s.index('.ribbon{')
          end = s.index('.hero{', start)
          ticker = '''.ribbon{position:relative;background:linear-gradient(90deg,#14061f,#32104d,#08253f,#063b39,#1d071e);color:#fff;text-align:center;font-family:system-ui,sans-serif;font-weight:800;padding:8px 6px 43px;font-size:11px;letter-spacing:.4px;overflow:hidden}.ribbon:after{content:"✨ మా దగ్గర COMPUTER EMBROIDERY WORKS STARTING PRICE ₹500/- మాత్రమే ✨          💖 Friends • బయట boutiques లో కట్టించే rate కంటే మా దగ్గర BEST PRICE OFFER మీకోసం 💖";position:absolute;left:0;top:31px;display:block;width:max-content;font-family:system-ui,sans-serif;font-size:24px;line-height:1;font-weight:1000;letter-spacing:.2px;color:#fff;white-space:pre;text-shadow:0 0 4px #fff,0 0 10px #00d9ff,0 0 18px #ff2d92;animation:aadhyaPriceScroll 26s linear infinite;will-change:transform}@keyframes aadhyaPriceScroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}'''
          s = s[:start] + ticker + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/style.css
          git rm .github/workflows/ticker-solid-fix.yml
          git commit -m "Make ticker text solid bright"
          git push